name: IONOS set GATE_PASSWORD

# One-time (re-runnable, idempotent) workflow to add GATE_PASSWORD to production's
# existing .env without touching anything else in it — see DECISIONS.md. Never prints
# .env's contents. Remove this file once it has run successfully (see DECISIONS.md's
# established convention for disposable operational workflows).

on:
  push:
    branches: [claude/netuqo-github-ionos-setup-uds6a2]
    paths: [.github/workflows/ionos-set-gate-password.yml]
  workflow_dispatch: {}

jobs:
  set-password:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Append GATE_PASSWORD to .env if not already present, then refresh config cache
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.IONOS_SSH_HOST }}
          port: ${{ secrets.IONOS_SSH_PORT }}
          username: ${{ secrets.IONOS_SSH_USER }}
          password: ${{ secrets.IONOS_SSH_PASSWORD }}
          script: |
            set -e
            cd "${{ secrets.IONOS_TARGET_DIR }}"
            if grep -q '^GATE_PASSWORD=' .env; then
              echo "GATE_PASSWORD already set in .env — leaving it untouched."
            else
              echo "GATE_PASSWORD=12345" >> .env
              echo "GATE_PASSWORD added to .env."
            fi
            /usr/bin/php8.4-cli artisan config:cache
            echo "Config cache refreshed."

      - name: Verify the gate actually unlocks with the new password (no secrets printed)
        run: |
          set -e
          jar=$(mktemp)
          curl -sS -c "$jar" -b "$jar" -o /dev/null https://netuqo.com/login
          token=$(curl -sS -c "$jar" -b "$jar" https://netuqo.com/login | grep -o 'name="_token" value="[^"]*"' | sed 's/.*value="//;s/"$//')
          test -n "$token"
          curl -sS -c "$jar" -b "$jar" -o /dev/null -L --data-urlencode "_token=$token" --data-urlencode "password=12345" https://netuqo.com/login
          status=$(curl -sS -c "$jar" -b "$jar" -o /dev/null -w '%{http_code}' https://netuqo.com/)
          echo "GET / after login: $status"
          test "$status" = "200"
          echo "✅ Gate unlocks with the configured password."
