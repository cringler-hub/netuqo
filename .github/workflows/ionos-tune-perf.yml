name: IONOS one-time perf tune-up

# One-time: switches the LIVE .env's SESSION_DRIVER and CACHE_STORE from 'database' to
# 'file'. Every request currently does a session read + write against MySQL (plus
# whatever the request itself queries) — moving those to local disk removes that
# round trip from every page load, including task capture. Safe to re-run (idempotent
# sed). Delete this workflow once confirmed applied. See DECISIONS.md.

on:
  push:
    branches: [main, claude/netuqo-github-ionos-setup-uds6a2]
    paths: ['.github/workflows/ionos-tune-perf.yml']
  workflow_dispatch: {}

jobs:
  tune:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Switch session/cache to file driver and rebuild config cache
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.IONOS_SSH_HOST }}
          port: ${{ secrets.IONOS_SSH_PORT }}
          username: ${{ secrets.IONOS_SSH_USER }}
          password: ${{ secrets.IONOS_SSH_PASSWORD }}
          script: |
            set -e
            cd "${{ secrets.IONOS_TARGET_DIR }}"
            mkdir -p storage/framework/sessions storage/framework/cache/data
            sed -i 's/^SESSION_DRIVER=.*/SESSION_DRIVER=file/' .env
            sed -i 's/^CACHE_STORE=.*/CACHE_STORE=file/' .env
            /usr/bin/php8.4-cli artisan config:clear
            /usr/bin/php8.4-cli artisan config:cache
            grep -E '^(SESSION_DRIVER|CACHE_STORE)=' .env
