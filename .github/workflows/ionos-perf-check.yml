name: IONOS perf diagnostic

# Temporary: times /diag-perf from two angles to find where task-capture latency goes —
# external (this runner, over the public internet, same path a real user takes) vs. what
# the app itself reports (boot time, DB round trip) from inside the request. See DECISIONS.md.

on:
  push:
    branches: [main, claude/netuqo-github-ionos-setup-uds6a2]
    paths: ['.github/workflows/ionos-perf-check.yml']
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    environment: production

    steps:
      # Known from earlier this session: this account's WAF treats GitHub Actions'
      # cloud IP ranges differently (previously a block page, here even a TLS-level
      # failure — curl exit 35). Best-effort only; the SSH-internal step below is
      # what actually isolates app/DB time from network/WAF.
      - name: External timing (this runner -> netuqo.com, like a real request)
        continue-on-error: true
        run: |
          set +e
          for i in 1 2 3; do
            curl -s -o /tmp/resp.json -w 'run '"$i"': time_namelookup=%{time_namelookup} time_connect=%{time_connect} time_appconnect=%{time_appconnect} time_starttransfer=%{time_starttransfer} time_total=%{time_total} exit=%{exitcode}\n' https://netuqo.com/diag-perf
          done
          echo "--- last response body ---"
          cat /tmp/resp.json
          exit 0

      - name: External timing for GET / (the page that reloads after every capture)
        continue-on-error: true
        run: |
          set +e
          for i in 1 2 3; do
            curl -s -o /dev/null -w 'run '"$i"': time_total=%{time_total} exit=%{exitcode}\n' https://netuqo.com/
          done
          exit 0

      - name: Internal timing via SSH (bypasses external network/WAF)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.IONOS_SSH_HOST }}
          port: ${{ secrets.IONOS_SSH_PORT }}
          username: ${{ secrets.IONOS_SSH_USER }}
          password: ${{ secrets.IONOS_SSH_PASSWORD }}
          script: |
            set -e
            cd "${{ secrets.IONOS_TARGET_DIR }}"
            echo "--- artisan boot + DB round trip, pure CLI, no HTTP at all ---"
            /usr/bin/php8.4-cli artisan tinker --execute="
              \$s = microtime(true);
              \Illuminate\Support\Facades\DB::select('select 1');
              echo 'db_ping_ms=' . round((microtime(true) - \$s) * 1000, 1) . PHP_EOL;
              echo 'db_connection=' . config('database.default') . PHP_EOL;
              echo 'db_host=' . config('database.connections.' . config('database.default') . '.host') . PHP_EOL;
            "
            echo "--- verbose curl to the live domain, FROM the server itself (why does it fail here too?) ---"
            set +e
            curl -v -s -o /dev/null -w 'time_total=%{time_total} exit=%{exitcode}\n' https://netuqo.com/diag-perf 2>&1 | tail -40
            echo "--- same, but forced to TLS 1.2 (is this a TLS 1.3-specific server bug?) ---"
            curl --tlsv1.2 --tls-max 1.2 -s -o /dev/null -w 'time_total=%{time_total} exit=%{exitcode}\n' https://netuqo.com/diag-perf
            echo "--- same, but without ALPN h2 offer (plain http/1.1 only) ---"
            curl --http1.1 -s -o /dev/null -w 'time_total=%{time_total} exit=%{exitcode}\n' https://netuqo.com/diag-perf
            set -e
            echo "--- curl version on this server ---"
            curl --version | head -2
            echo "--- opcache status for the CLI SAPI (web SAPI may differ) ---"
            /usr/bin/php8.4-cli -r "var_dump(function_exists('opcache_get_status') ? ini_get('opcache.enable') : 'no opcache ext');"
