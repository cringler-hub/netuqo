name: Deploy to IONOS

on:
  push:
    branches: [main, claude/netuqo-github-ionos-setup-uds6a2]
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, mysql
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install PHP dependencies (production)
        run: composer install --no-interaction --prefer-dist --no-progress --no-dev --optimize-autoloader

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      # We ship the whole Laravel app, including vendor/, because the deploy shouldn't
      # depend on composer being available/network-reachable on the IONOS side. `storage/`
      # is excluded on purpose: it holds runtime state (logs, cache, sessions, uploads)
      # that must survive across deploys, not be overwritten from a fresh checkout.
      #
      # IONOS's SSH access here has no key-management UI, so we authenticate with a
      # password (stored as a GitHub secret) instead of a keypair.
      - name: Sync files to IONOS over SFTP
        env:
          SSHPASS: ${{ secrets.IONOS_SSH_PASSWORD }}
        run: |
          sudo apt-get update -y -qq && sudo apt-get install -y -qq sshpass rsync
          sshpass -e rsync -avzr --delete \
            -e "ssh -p ${{ secrets.IONOS_SSH_PORT }} -o StrictHostKeyChecking=accept-new" \
            --exclude=/.git/ \
            --exclude=/.github/ \
            --exclude=/node_modules/ \
            --exclude=/tests/ \
            --exclude=/.env \
            --exclude=/.env.example \
            --exclude=/storage/ \
            --exclude=/database/*.sqlite \
            ./ "${{ secrets.IONOS_SSH_USER }}@${{ secrets.IONOS_SSH_HOST }}:${{ secrets.IONOS_TARGET_DIR }}"

      # Confirmed working via the (now removed) ionos-check.yml diagnostic:
      # - real shell access, not just SFTP, is available on this account.
      # - bare 'php' resolves to an ancient PHP 4.4 CGI fallback — the real PHP 8.4 CLI
      #   binary on this account is /usr/bin/php8.4-cli, so we call it explicitly.
      - name: Run migrations & rebuild caches on the server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.IONOS_SSH_HOST }}
          port: ${{ secrets.IONOS_SSH_PORT }}
          username: ${{ secrets.IONOS_SSH_USER }}
          password: ${{ secrets.IONOS_SSH_PASSWORD }}
          script: |
            cd ${{ secrets.IONOS_TARGET_DIR }}
            /usr/bin/php8.4-cli artisan migrate --force
            /usr/bin/php8.4-cli artisan config:cache
            /usr/bin/php8.4-cli artisan route:cache
            /usr/bin/php8.4-cli artisan view:cache
