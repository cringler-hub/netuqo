name: Deploy to IONOS

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, mysql
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install PHP dependencies (production)
        run: composer install --no-interaction --prefer-dist --no-progress --no-dev --optimize-autoloader

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      # We ship the whole Laravel app, including vendor/, because the deploy shouldn't
      # depend on composer being available/network-reachable on the IONOS side. `storage/`
      # is excluded on purpose: it holds runtime state (logs, cache, sessions, uploads)
      # that must survive across deploys, not be overwritten from a fresh checkout.
      - name: Sync files to IONOS over SSH
        uses: easingthemes/ssh-deploy@v5
        with:
          SSH_PRIVATE_KEY: ${{ secrets.IONOS_SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.IONOS_SSH_HOST }}
          REMOTE_PORT: ${{ secrets.IONOS_SSH_PORT }}
          REMOTE_USER: ${{ secrets.IONOS_SSH_USER }}
          SOURCE: './'
          TARGET: ${{ secrets.IONOS_TARGET_DIR }}
          ARGS: '-avzr --delete'
          EXCLUDE: |
            /.git/
            /.github/
            /node_modules/
            /tests/
            /.env
            /.env.example
            /storage/
            /database/*.sqlite

      - name: Run migrations & rebuild caches on the server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.IONOS_SSH_HOST }}
          port: ${{ secrets.IONOS_SSH_PORT }}
          username: ${{ secrets.IONOS_SSH_USER }}
          key: ${{ secrets.IONOS_SSH_PRIVATE_KEY }}
          script: |
            cd ${{ secrets.IONOS_TARGET_DIR }}
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
