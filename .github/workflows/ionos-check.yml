name: IONOS connection check (temporary)

# The 500 on POST /tasks never reached storage/logs/laravel.log — meaning it crashes
# before Laravel's own exception handler runs. Reproducing directly + checking PHP's own
# error log + route registration. Delete once resolved.

on:
  workflow_dispatch: {}
  push:
    branches: [claude/netuqo-github-ionos-setup-uds6a2]
    paths: ['.github/workflows/ionos-check.yml']

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Reproduce the POST from the runner (full response)
        run: |
          echo "--- GET / first, to capture a session cookie + CSRF token ---"
          curl -s -c /tmp/cookies.txt -o /tmp/home.html -w "GET / -> HTTP %{http_code}\n" http://netuqo.com/
          TOKEN=$(grep -oP 'name="_token" value="\K[^"]+' /tmp/home.html || true)
          echo "csrf token found: ${TOKEN:0:8}..."
          echo "--- POST /tasks with that token ---"
          curl -s -b /tmp/cookies.txt -o /tmp/post.html -w "POST /tasks -> HTTP %{http_code}\n" \
            -d "title=Diagnostic+Test+Task" -d "_token=${TOKEN}" http://netuqo.com/tasks
          echo "--- first 100 lines of the response body ---"
          head -n 100 /tmp/post.html

      - name: Check route registration + PHP's own error log on the server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.IONOS_SSH_HOST }}
          port: ${{ secrets.IONOS_SSH_PORT }}
          username: ${{ secrets.IONOS_SSH_USER }}
          password: ${{ secrets.IONOS_SSH_PASSWORD }}
          script: |
            cd "${{ secrets.IONOS_TARGET_DIR }}"
            echo "--- registered routes ---"
            /usr/bin/php8.4-cli artisan route:list 2>&1
            echo "--- php.ini error_log setting ---"
            /usr/bin/php8.4-cli -i 2>&1 | grep -i "error_log\|display_errors\|log_errors " || true
            echo "--- tail of that error_log file, if set and readable ---"
            ERRLOG=$(/usr/bin/php8.4-cli -i 2>&1 | grep -i "^error_log" | awk -F'=> ' '{print $2}' | head -1)
            echo "error_log path: $ERRLOG"
            if [ -n "$ERRLOG" ] && [ -f "$ERRLOG" ]; then
              tail -n 80 "$ERRLOG"
            else
              echo "not set to a readable file (goes to Apache's own log we can't see, or stderr)"
            fi
            echo "--- storage/logs/laravel.log tail again (post-repro) ---"
            tail -n 40 storage/logs/laravel.log 2>&1 || echo "no laravel.log"
            echo "--- reproduce the exact controller logic via CLI (real errors show here) ---"
            /usr/bin/php8.4-cli artisan tinker --execute="
              \$u = App\Models\User::firstOrCreate(['email' => 'owner@netuqo.com'], ['name' => 'Owner', 'password' => bcrypt(str()->random(40))]);
              echo 'user ok: ' . \$u->id . PHP_EOL;
              \$t = \$u->tasks()->create(['title' => 'CLI Diagnostic Task', 'due_at' => null, 'area' => null]);
              echo 'task ok: ' . \$t->id . PHP_EOL;
            " 2>&1
            echo "--- tasks table schema ---"
            /usr/bin/php8.4-cli artisan tinker --execute="print_r(DB::select('describe tasks'));" 2>&1
