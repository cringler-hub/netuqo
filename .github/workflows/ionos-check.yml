name: IONOS connection check (temporary)

# Theory: EVERY non-root path fails (Apache/mod_rewrite/PHP-CGI issue), not just our
# custom routes. Testing Laravel's own built-in /up health-check route, which has existed
# since the very first deploy and has zero custom code — the cleanest possible control.

on:
  workflow_dispatch: {}
  push:
    branches: [claude/netuqo-github-ionos-setup-uds6a2]
    paths: ['.github/workflows/ionos-check.yml']

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Test GET / vs GET /up (Laravel's built-in health check, zero custom code)
        run: |
          curl -s -o /tmp/home.html -w "GET / -> HTTP %{http_code}\n" http://netuqo.com/
          curl -s -o /tmp/up.html -w "GET /up -> HTTP %{http_code}\n" http://netuqo.com/up
          head -c 300 /tmp/up.html; echo
