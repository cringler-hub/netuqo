name: IONOS connection check (temporary)

# Testing the documented IONOS-specific .htaccess fix (RewriteBase / + FollowSymLinks)
# for the mod_rewrite-internal-redirect 500 bug. Delete once confirmed.

on:
  workflow_dispatch: {}
  push:
    branches: [claude/netuqo-github-ionos-setup-uds6a2]
    paths: ['.github/workflows/ionos-check.yml']

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Test GET / and GET /up after the .htaccess fix
        run: |
          curl -s -o /tmp/home.html -w "GET / -> HTTP %{http_code}\n" http://netuqo.com/
          curl -s -o /tmp/up.html -w "GET /up -> HTTP %{http_code}\n" http://netuqo.com/up
          head -c 300 /tmp/up.html; echo
