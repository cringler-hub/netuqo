name: IONOS connection check (temporary)

# GET /diag (brand new route, trivial closure + view) fails with the same 500 as POST
# /tasks — so this isn't CSRF/POST-specific after all. Checking whether GET / still
# works, and what Laravel's own log says now.

on:
  workflow_dispatch: {}
  push:
    branches: [claude/netuqo-github-ionos-setup-uds6a2]
    paths: ['.github/workflows/ionos-check.yml']

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Compare GET / vs GET /diag, then check the Laravel log
        run: |
          echo "--- GET / (known-good Today page) ---"
          curl -s -o /tmp/home.html -w "HTTP %{http_code}\n" http://netuqo.com/
          echo "--- GET /diag (new route) ---"
          curl -s -o /tmp/diag.html -w "HTTP %{http_code}\n" http://netuqo.com/diag
          head -c 300 /tmp/diag.html; echo

      - name: Tail Laravel log + list compiled views on the server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.IONOS_SSH_HOST }}
          port: ${{ secrets.IONOS_SSH_PORT }}
          username: ${{ secrets.IONOS_SSH_USER }}
          password: ${{ secrets.IONOS_SSH_PASSWORD }}
          script: |
            cd "${{ secrets.IONOS_TARGET_DIR }}"
            echo "--- resources/views/diag.blade.php present? ---"
            ls -la resources/views/diag.blade.php 2>&1 || echo "MISSING"
            echo "--- storage/framework/views (compiled cache) ---"
            ls -la storage/framework/views | head -20
            echo "--- tail of laravel.log ---"
            tail -n 60 storage/logs/laravel.log 2>&1 || echo "no laravel.log"
            echo "--- try rendering the diag view directly via CLI ---"
            /usr/bin/php8.4-cli artisan tinker --execute="echo view('diag')->render();" 2>&1 | head -40
