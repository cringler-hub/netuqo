name: IONOS connection check (temporary)

# Fix confirmed: RewriteBase / + Options +FollowSymLinks resolved the mod_rewrite bug
# (GET /up now returns 200). Final end-to-end test: actually create a task via POST
# /tasks with a real CSRF token, then verify it shows up on /. Delete after this passes.

on:
  workflow_dispatch: {}
  push:
    branches: [claude/netuqo-github-ionos-setup-uds6a2]
    paths: ['.github/workflows/ionos-check.yml']

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Create a real task via POST /tasks, then verify it appears on /
        run: |
          curl -s -c /tmp/cookies.txt -o /tmp/home.html -w "GET / -> HTTP %{http_code}\n" http://netuqo.com/
          TOKEN=$(grep -oP 'name="_token" value="\K[^"]+' /tmp/home.html || true)
          curl -s -b /tmp/cookies.txt -o /tmp/post.html -w "POST /tasks -> HTTP %{http_code}\n" \
            -L -d "title=CI+End-to-End+Test&area=business&due_at=2026-09-10" -d "_token=${TOKEN}" \
            http://netuqo.com/tasks
          echo "--- does the response now show the new task? ---"
          grep -c "CI End-to-End Test" /tmp/post.html || echo "not found"
