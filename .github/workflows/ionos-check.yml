name: IONOS connection check (temporary)

# CONFIRMED: even Laravel's own zero-code /up route 500s. Only the exact domain root
# works. This isn't our app — it's a server/rewrite-level issue. Last two checks to
# pin down the exact mechanism: does a DIRECT (non-rewritten) request to index.php work,
# and does a genuinely nonexistent path 404 cleanly or also 500?

on:
  workflow_dispatch: {}
  push:
    branches: [claude/netuqo-github-ionos-setup-uds6a2]
    paths: ['.github/workflows/ionos-check.yml']

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Direct index.php vs a genuinely nonexistent path
        run: |
          echo "--- GET /index.php directly (bypasses rewrite) ---"
          curl -s -o /tmp/direct.html -w "HTTP %{http_code}\n" http://netuqo.com/index.php
          head -c 300 /tmp/direct.html; echo
          echo "--- GET /this-path-does-not-exist-xyz123 ---"
          curl -s -o /tmp/none.html -w "HTTP %{http_code}\n" http://netuqo.com/this-path-does-not-exist-xyz123
          head -c 300 /tmp/none.html; echo
