name: IONOS connection check (temporary)

# route:cache works fine in isolation (exit 0, /diag correctly listed). Testing whether
# the fresh route:clear + route:cache we just ran changed anything for real HTTP requests.

on:
  workflow_dispatch: {}
  push:
    branches: [claude/netuqo-github-ionos-setup-uds6a2]
    paths: ['.github/workflows/ionos-check.yml']

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Test GET /diag right now
        run: |
          curl -s -o /tmp/diag.html -w "GET /diag -> HTTP %{http_code}\n" http://netuqo.com/diag
          head -c 300 /tmp/diag.html; echo
          curl -s -o /tmp/home.html -w "GET / -> HTTP %{http_code}\n" http://netuqo.com/
