name: IONOS connection check (temporary)

# One-off diagnostic: confirms whether the IONOS SSH access is a real interactive shell
# (needed for the `php artisan migrate` step in deploy.yml) and what the actual folder
# layout / PHP version look like. Delete this file once IONOS setup is confirmed working.

on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: SFTP file-listing check
        env:
          SSHPASS: ${{ secrets.IONOS_SSH_PASSWORD }}
        run: |
          sudo apt-get update -y -qq && sudo apt-get install -y -qq sshpass
          echo "--- SFTP: pwd + ls at webspace root ---"
          sshpass -e sftp -o StrictHostKeyChecking=accept-new -P "${{ secrets.IONOS_SSH_PORT }}" \
            "${{ secrets.IONOS_SSH_USER }}@${{ secrets.IONOS_SSH_HOST }}" <<EOF
          pwd
          ls -la
          EOF

      - name: Real shell check
        uses: appleboy/ssh-action@v1.2.0
        continue-on-error: true
        with:
          host: ${{ secrets.IONOS_SSH_HOST }}
          port: ${{ secrets.IONOS_SSH_PORT }}
          username: ${{ secrets.IONOS_SSH_USER }}
          password: ${{ secrets.IONOS_SSH_PASSWORD }}
          script: |
            echo "--- whoami / pwd ---"
            whoami
            pwd
            echo "--- folder listing ---"
            ls -la
            echo "--- php version ---"
            php -v || echo "php command not found"
            echo "--- rsync availability (needed by deploy.yml) ---"
            rsync --version || echo "rsync not found on remote"
