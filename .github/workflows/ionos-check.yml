name: IONOS connection check (temporary)

# Isolating the POST /tasks 500: /diag-ping goes through normal CSRF, /diag-ping-nocsrf
# is excluded from CSRF entirely. If nocsrf works but the other doesn't, it's CSRF/session.
# If both fail, it's something more fundamental about POST on this server. Delete once
# resolved, along with the diag routes in routes/web.php and bootstrap/app.php.

on:
  workflow_dispatch: {}
  push:
    branches: [claude/netuqo-github-ionos-setup-uds6a2]
    paths: ['.github/workflows/ionos-check.yml']

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Test both diagnostic POST endpoints
        run: |
          echo "--- POST /diag-ping-nocsrf (no CSRF middleware at all, no body) ---"
          curl -s -o /tmp/nocsrf.html -w "HTTP %{http_code}\n" -X POST http://netuqo.com/diag-ping-nocsrf
          head -c 500 /tmp/nocsrf.html; echo

          echo "--- POST /diag-ping WITHOUT a valid token (expect a clean 419, not a raw 500) ---"
          curl -s -o /tmp/noauth.html -w "HTTP %{http_code}\n" -X POST http://netuqo.com/diag-ping
          head -c 500 /tmp/noauth.html; echo

          echo "--- POST /diag-ping WITH a valid session + token ---"
          curl -s -c /tmp/cookies.txt -o /tmp/home.html -w "GET / -> HTTP %{http_code}\n" http://netuqo.com/
          TOKEN=$(grep -oP 'name="_token" value="\K[^"]+' /tmp/home.html || true)
          curl -s -b /tmp/cookies.txt -o /tmp/ping.html -w "HTTP %{http_code}\n" -d "_token=${TOKEN}" http://netuqo.com/diag-ping
          head -c 500 /tmp/ping.html; echo
