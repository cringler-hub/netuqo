name: IONOS connection check (temporary)

# Theory: route:cache silently fails on our closure-based diag routes (no `set -e` in
# deploy.yml's cache step means a failing route:cache doesn't fail the whole step, since
# view:cache runs after it and "succeeds"). Testing route:cache in isolation with its exit
# code and full output.

on:
  workflow_dispatch: {}
  push:
    branches: [claude/netuqo-github-ionos-setup-uds6a2]
    paths: ['.github/workflows/ionos-check.yml']

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Run route:cache in isolation, capture its real exit code
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.IONOS_SSH_HOST }}
          port: ${{ secrets.IONOS_SSH_PORT }}
          username: ${{ secrets.IONOS_SSH_USER }}
          password: ${{ secrets.IONOS_SSH_PASSWORD }}
          script: |
            cd "${{ secrets.IONOS_TARGET_DIR }}"
            echo "--- route:clear first ---"
            /usr/bin/php8.4-cli artisan route:clear 2>&1
            echo "--- route:cache (capturing exit code explicitly) ---"
            /usr/bin/php8.4-cli artisan route:cache 2>&1
            echo "route:cache exit code: $?"
            echo "--- is bootstrap/cache/routes-v7.php present? ---"
            ls -la bootstrap/cache/ 2>&1
            echo "--- route:list after caching ---"
            /usr/bin/php8.4-cli artisan route:list 2>&1
